<!-- Début du Module Quiz Interactif -->
<div id="edu-quiz-app" style="max-width: 680px; margin: 20px auto; font-family: system-ui, -apple-system, sans-serif; border: 1px solid #e2e8f0; border-radius: 12px; background: #ffffff; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
  
  <!-- En-tête -->
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 20px;">
    <span id="quiz-progress" style="font-size: 14px; font-weight: 600; color: #475569;">Question 1 / 5</span>
    <span id="quiz-timer" style="font-size: 14px; font-weight: 600; color: #0f172a; background: #f1f5f9; padding: 4px 10px; border-radius: 6px; font-variant-numeric: tabular-nums;">00:00</span>
  </div>

  <!-- Zone de question -->
  <div id="quiz-body">
    <h3 id="quiz-question" style="font-size: 18px; color: #0f172a; margin: 0 0 18px 0; line-height: 1.5;">Chargement...</h3>
    <div id="quiz-options" style="display: flex; flex-direction: column; gap: 10px;"></div>
    
    <!-- Explication -->
    <div id="quiz-explanation" style="display: none; margin-top: 16px; padding: 14px; background: #f8fafc; border-left: 4px solid #3b82f6; border-radius: 6px; font-size: 14px; color: #334155; line-height: 1.5;"></div>
    
    <button id="quiz-next-btn" type="button" style="display: none; margin-top: 18px; width: 100%; padding: 12px; background: #0f172a; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;">Question suivante →</button>
  </div>

  <!-- Écran de résultat final -->
  <div id="quiz-result" style="display: none; text-align: center; padding: 10px 0;">
    <div style="font-size: 14px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Résultat de votre révision</div>
    <div id="quiz-score" style="font-size: 42px; font-weight: 800; color: #0f172a; margin: 8px 0;">0 / 20</div>
    <div id="quiz-time-summary" style="font-size: 14px; color: #475569; margin-bottom: 24px;">Temps écoulé : 00:00</div>
    
    <!-- Bouton Téléchargement Monétisé -->
    <a id="quiz-download-link" href="#" target="_blank" rel="noopener noreferrer" style="display: block; padding: 14px 20px; background: #16a34a; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 15px; margin-bottom: 12px;">
      📥 Télécharger le Résumé PDF &amp; Annales Corrigées
    </a>
    
    <button id="quiz-restart-btn" type="button" style="padding: 10px 18px; background: #f1f5f9; color: #334155; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">
      ↻ Recommencer le quiz
    </button>
  </div>
</div>

<script>
//<![CDATA[
(function() {
  // ==========================================
  // 1. CONFIGURATION À MODIFIER PAR ARTICLE
  // ==========================================
  const DOWNLOAD_URL = "https://dl.monsite.ma/download/pack-examens-svt-2bac"; // <-- Remplacez par votre lien Safelink Vercel ou Up-4ever
  const DOWNLOAD_TEXT = "📥 Télécharger le Pack Examens SVT (PDF - 12 Mo)";

  const questions = [
    {
      q: "Où se déroule la glycolyse dans la cellule eucaryote ?",
      options: ["Dans la matrice mitochondriale", "Dans le hyaloplasme", "Au niveau des crêtes mitochondriales", "Dans le noyau"],
      answer: 1,
      explanation: "La glycolyse est une étape commune à la respiration et à la fermentation qui se déroule dans le hyaloplasme (cytoplasme) sans consommation d'O₂."
    },
    {
      q: "Quel est le bilan énergétique global en ATP de la respiration cellulaire pour une molécule de glucose ?",
      options: ["2 ATP", "18 ATP", "36 ou 38 ATP", "4 ATP"],
      answer: 2,
      explanation: "L'oxydation complète d'une molécule de glucose par respiration cellulaire produit 36 à 38 molécules d'ATP, contre seulement 2 ATP pour la fermentation."
    },
    {
      q: "Quel transporteur d'électrons est réduit lors du cycle de Krebs ?",
      options: ["L'ATP uniquement", "Le NAD+ et le FAD", "Le dioxygène (O₂)", "L'acide pyruvique"],
      answer: 1,
      explanation: "Le cycle de Krebs réduit les transporteurs NAD+ en NADH,H+ et FAD en FADH₂, qui iront ensuite alimenter la chaîne respiratoire."
    },
    {
      q: "Quel ion joue un rôle indispensable dans la fixation de la tête de myosine sur l'actine ?",
      options: ["L'ion Sodium (Na+)", "L'ion Potassium (K+)", "L'ion Calcium (Ca2+)", "L'ion Chlorure (Cl-)"],
      answer: 2,
      explanation: "Libérés par le réticulum sarcoplasmique, les ions Ca2+ se fixent sur la troponine, démasquant les sites de fixation de la myosine sur l'actine."
    },
    {
      q: "La fermentation lactique transforme l'acide pyruvique en :",
      options: ["Éthanol et CO₂", "Acide lactique sans dégagement de CO₂", "Acétyl-CoA et CO₂", "Glucose et ATP"],
      answer: 1,
      explanation: "Contrairement à la fermentation alcoolique, la fermentation lactique produit de l'acide lactique sans aucun dégagement de dioxyde de carbone (CO₂)."
    }
  ];

  // ==========================================
  // 2. LOGIQUE DU QUIZ (NE PAS MODIFIER)
  // ==========================================
  let currentIdx = 0;
  let score = 0;
  let seconds = 0;
  let timerInterval;
  let answered = false;

  const progressEl = document.getElementById("quiz-progress");
  const timerEl = document.getElementById("quiz-timer");
  const questionEl = document.getElementById("quiz-question");
  const optionsEl = document.getElementById("quiz-options");
  const explanationEl = document.getElementById("quiz-explanation");
  const nextBtn = document.getElementById("quiz-next-btn");
  const bodyEl = document.getElementById("quiz-body");
  const resultEl = document.getElementById("quiz-result");
  const scoreEl = document.getElementById("quiz-score");
  const timeSummaryEl = document.getElementById("quiz-time-summary");
  const downloadLinkEl = document.getElementById("quiz-download-link");
  const restartBtn = document.getElementById("quiz-restart-btn");

  downloadLinkEl.href = DOWNLOAD_URL;
  downloadLinkEl.textContent = DOWNLOAD_TEXT;

  function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function startTimer() {
    clearInterval(timerInterval);
    seconds = 0;
    timerEl.textContent = "00:00";
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function renderQuestion() {
    answered = false;
    explanationEl.style.display = "none";
    nextBtn.style.display = "none";
    const item = questions[currentIdx];
    progressEl.textContent = `Question ${currentIdx + 1} / ${questions.length}`;
    questionEl.textContent = item.q;
    optionsEl.innerHTML = "";

    item.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = opt;
      btn.style.cssText = "text-align: left; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #1e293b; font-size: 15px; cursor: pointer; transition: all 0.15s;";
      btn.onclick = () => selectAnswer(idx);
      optionsEl.appendChild(btn);
    });
  }

  function selectAnswer(selectedIdx) {
    if (answered) return;
    answered = true;
    const item = questions[currentIdx];
    const allBtns = optionsEl.querySelectorAll("button");

    allBtns.forEach((b, i) => {
      b.disabled = true;
      b.style.cursor = "default";
      if (i === item.answer) {
        b.style.background = "#dcfce7";
        b.style.borderColor = "#16a34a";
        b.style.color = "#14532d";
        b.style.fontWeight = "600";
      } else if (i === selectedIdx && selectedIdx !== item.answer) {
        b.style.background = "#fee2e2";
        b.style.borderColor = "#dc2626";
        b.style.color = "#7f1d1d";
      }
    });

    if (selectedIdx === item.answer) score++;
    explanationEl.innerHTML = `<strong>Explication :</strong> ${item.explanation}`;
    explanationEl.style.display = "block";
    nextBtn.textContent = currentIdx === questions.length - 1 ? "Voir ma note sur 20 →" : "Question suivante →";
    nextBtn.style.display = "block";
  }

  nextBtn.onclick = () => {
    currentIdx++;
    if (currentIdx < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  };

  function showResult() {
    clearInterval(timerInterval);
    bodyEl.style.display = "none";
    resultEl.style.display = "block";
    const note20 = Math.round((score / questions.length) * 20 * 10) / 10;
    scoreEl.textContent = `${note20} / 20`;
    timeSummaryEl.textContent = `Bonnes réponses : ${score}/${questions.length} • Temps : ${formatTime(seconds)}`;
  }

  restartBtn.onclick = () => {
    currentIdx = 0;
    score = 0;
    resultEl.style.display = "none";
    bodyEl.style.display = "block";
    startTimer();
    renderQuestion();
  };

  startTimer();
  renderQuestion();
})();
//]]>
</script>
<!-- Fin du Module Quiz Interactif -->
