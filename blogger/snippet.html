<!-- ==========================================================================
  SCRIPT D'INTÉGRATION BLOGGER -> SUPABASE -> VERCEL (SAFELINK)
  
  INSTALLATION DANS BLOGGER :
  1. Allez dans Blogger -> Thème -> Modifier le code HTML.
  2. Cherchez la balise de fermeture </body> (tout en bas).
  3. Collez ce bloc JUSTE AVANT </body>.
  4. Remplacez les 3 variables de configuration (SUPABASE_URL, SUPABASE_ANON_KEY, VERCEL_DOWNLOAD_BASE).

  UTILISATION DANS VOS ARTICLES BLOGGER (Vue HTML) :
  Collez simplement la balise générée par votre panneau admin :
  <div class="edu-download-box" data-slug="pack-maths-2bac-pc-svt"></div>
=========================================================================== -->

<style>
  /* Design Mobile-First & léger pour Blogger (n'impacte pas les Core Web Vitals) */
  .edu-download-box {
    margin: 1.5rem 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .edu-dl-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-left: 4px solid #059669;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .edu-dl-card:hover {
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
  }

  .edu-dl-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .edu-dl-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 9999px;
    letter-spacing: 0.01em;
  }

  .edu-dl-badge-level {
    background: #ecfdf5;
    color: #047857;
  }

  .edu-dl-badge-subject {
    background: #eff6ff;
    color: #1d4ed8;
  }

  .edu-dl-badge-format {
    background: #f1f5f9;
    color: #475569;
  }

  .edu-dl-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: #0f172a;
    line-height: 1.4;
  }

  .edu-dl-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: #64748b;
  }

  .edu-dl-meta span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .edu-dl-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    box-sizing: border-box;
    background: #059669;
    color: #ffffff !important;
    text-decoration: none !important;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 18px;
    border-radius: 10px;
    transition: background 0.15s ease;
  }

  .edu-dl-btn:hover {
    background: #047857;
  }

  .edu-dl-skeleton {
    height: 110px;
    border-radius: 12px;
    background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
    background-size: 200% 100%;
    animation: eduShimmer 1.4s infinite;
  }

  .edu-dl-error {
    font-size: 13px;
    color: #b91c1c;
    background: #fef2f2;
    border: 1px solid #fecaca;
    padding: 12px 14px;
    border-radius: 10px;
  }

  @keyframes eduShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @media (min-width: 640px) {
    .edu-dl-card {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
    }

    .edu-dl-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .edu-dl-btn {
      width: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }
  }
</style>

<script>
//<![CDATA[
(function () {
  // === CONFIGURATION (CONNECTÉE À VOTRE PROJET SUPABASE) ===
  var SUPABASE_URL = "https://anteeislnpcdhqhgmebm.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_yRgG21YS9ANbVe-sdgTVbQ_VjS6fmNd";
  var VERCEL_DOWNLOAD_BASE = "https://dl.monsite.ma/download";

  // Protection XSS : échappe les caractères HTML avant injection
  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatNumber(num) {
    try {
      return Number(num || 0).toLocaleString("fr-FR");
    } catch (e) {
      return String(num || 0);
    }
  }

  function initEduDownloadBoxes() {
    var containers = document.querySelectorAll(".edu-download-box[data-slug]");
    if (!containers.length) return;

    // 1. Collecte tous les slugs uniques présents sur l'article pour faire UNE SEULE requête HTTP
    var slugMap = {};
    var slugs = [];
    for (var i = 0; i < containers.length; i++) {
      var slug = (containers[i].getAttribute("data-slug") || "").trim();
      if (slug) {
        containers[i].innerHTML = '<div class="edu-dl-skeleton" aria-label="Chargement du fichier..."></div>';
        if (!slugMap[slug]) {
          slugMap[slug] = true;
          slugs.push(slug);
        }
      }
    }

    if (!slugs.length) return;

    // 2. Appel en lecture seule à l'API REST de Supabase (PostgREST)
    var encodedSlugs = slugs.map(function (s) {
      return '"' + s.replace(/"/g, "") + '"';
    }).join(",");

    var endpoint =
      SUPABASE_URL.replace(/\/$/, "") +
      "/rest/v1/resources?slug=in.(" +
      encodeURIComponent(encodedSlugs) +
      ")&select=slug,title,subject,grade_level,file_size,file_format,download_count";

    fetch(endpoint, {
      method: "GET",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Accept: "application/json"
      }
    })
      .then(function (response) {
        if (!response.ok) throw new Error("Erreur HTTP " + response.status);
        return response.json();
      })
      .then(function (rows) {
        // Indexation des résultats par slug
        var bySlug = {};
        if (Array.isArray(rows)) {
          for (var j = 0; j < rows.length; j++) {
            bySlug[rows[j].slug] = rows[j];
          }
        }

        // 3. Injection du HTML final pour chaque bloc sur la page
        for (var k = 0; k < containers.length; k++) {
          var el = containers[k];
          var slug = (el.getAttribute("data-slug") || "").trim();
          var item = bySlug[slug];

          if (!item) {
            el.innerHTML =
              '<div class="edu-dl-error">Ressource introuvable ou lien temporairement indisponible.</div>';
            continue;
          }

          var downloadUrl =
            VERCEL_DOWNLOAD_BASE.replace(/\/$/, "") + "/" + encodeURIComponent(item.slug);

          el.innerHTML =
            '<div class="edu-dl-card">' +
              '<div class="edu-dl-info">' +
                '<div class="edu-dl-badges">' +
                  '<span class="edu-dl-badge edu-dl-badge-level">' + escapeHtml(item.grade_level) + '</span>' +
                  '<span class="edu-dl-badge edu-dl-badge-subject">' + escapeHtml(item.subject) + '</span>' +
                  '<span class="edu-dl-badge edu-dl-badge-format">' + escapeHtml(item.file_format || "PDF") + '</span>' +
                '</div>' +
                '<p class="edu-dl-title">' + escapeHtml(item.title) + '</p>' +
                '<div class="edu-dl-meta">' +
                  '<span>&#128190; Taille : <strong>' + escapeHtml(item.file_size) + '</strong></span>' +
                  '<span>&#11015;&#65039; <strong>' + formatNumber(item.download_count) + '</strong> téléchargements</span>' +
                '</div>' +
              '</div>' +
              '<a class="edu-dl-btn" href="' + escapeHtml(downloadUrl) + '" target="_blank" rel="noopener noreferrer">' +
                '<span>Télécharger gratuitement</span>' +
                '<span aria-hidden="true">&#8594;</span>' +
              '</a>' +
            '</div>';
        }
      })
      .catch(function (err) {
        console.error("[EduDownloadBox]", err);
        for (var m = 0; m < containers.length; m++) {
          containers[m].innerHTML =
            '<div class="edu-dl-error">Impossible de charger les informations du fichier. Rechargez la page.</div>';
        }
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initEduDownloadBoxes);
  } else {
    initEduDownloadBoxes();
  }
})();
//]]>
</script>
